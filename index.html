<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Rep Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F0EDE8;--surface:#FFFFFF;--surface2:#E8E4DE;--border:#D4CEC6;
  --text:#1A1612;--text2:#6B6560;--text3:#9E9890;
  --green:#2D6A4F;--gl:#D8EDDF;--gt:#1B4332;
  --warn:#C77C27;--wl:#FEF3E2;--wt:#7C4A03;
  --red:#C0392B;--rl:#FDECEA;--rt:#7B241C;
  --blue:#1A56A0;--bl:#E0ECFB;--bt:#0C3568;
  --purple:#5B4FCF;--pl:#EEEDFB;--pt:#2D2373;
  --teal:#0F6E56;--tl:#D8F0EA;--tt:#064030;
  --accent:#5B4FCF;
  --r:10px;--rl2:16px;
}
body.dark{
  --bg:#0A0B11;--surface:#16181F;--surface2:#1F2233;--border:#313550;
  --text:#E8EAF4;--text2:#9DA3BE;--text3:#5C6280;
  --green:#3D9970;--gl:#1A3328;--gt:#5EC994;
  --warn:#E09030;--wl:#2E2010;--wt:#F0B060;
  --red:#E05050;--rl:#2E1515;--rt:#F07070;
  --blue:#4A90D9;--bl:#1A2A40;--bt:#7AB8F5;
  --purple:#8B7CF0;--pl:#1E1A3A;--pt:#B0A0FF;
  --teal:#3ABFA0;--tl:#0F2820;--tt:#60D9BC;
  --accent:#8B7CF0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;transition:background .3s,color .3s}

/* ── LOGIN ── */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 40%,#0f3460 70%,#1a1a2e 100%);position:relative;overflow:hidden}
#loginScreen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(91,79,207,.3) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(29,158,117,.2) 0%,transparent 50%);pointer-events:none}
.login-orb{position:absolute;border-radius:50%;pointer-events:none;animation:floatOrb 8s ease-in-out infinite}
@keyframes floatOrb{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.04)}}
.login-card{background:rgba(255,255,255,.07);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:36px 32px;width:100%;max-width:390px;box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);position:relative;z-index:1}
.login-logo-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.login-app-name{font-size:19px;font-weight:700;letter-spacing:-.3px;color:#fff;flex:1}
.login-tagline{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:22px}
.role-toggle{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:4px;gap:3px;margin-bottom:20px}
.role-btn{flex:1;padding:9px 0;border:none;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;background:transparent;color:rgba(255,255,255,.5);transition:all .25s}
.role-btn.active{background:rgba(255,255,255,.15);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.btn-google{width:100%;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:500;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;margin-bottom:14px}
.btn-google:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35)}
.divider-or{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.3);font-size:12px;margin-bottom:14px}
.divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.15)}
.login-label{display:block;font-size:11px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.4px;font-family:'DM Mono',monospace;margin-bottom:5px}
.login-input{width:100%;padding:11px 14px;border:1px solid rgba(255,255,255,.15);border-radius:12px;font-size:13px;color:#fff;background:rgba(255,255,255,.08);font-family:'DM Sans',sans-serif;outline:none;transition:all .2s;margin-bottom:12px}
.login-input::placeholder{color:rgba(255,255,255,.3)}
.login-input:focus{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4)}
.btn-login{width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px;background:linear-gradient(135deg,#5B4FCF 0%,#3D9970 100%);color:#fff;letter-spacing:.2px;transition:opacity .2s,transform .15s;box-shadow:0 4px 16px rgba(91,79,207,.4)}
.btn-login:hover{opacity:.9;transform:translateY(-1px)}
.login-err{background:rgba(192,57,43,.2);color:#ff9090;border:1px solid rgba(192,57,43,.3);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}
.setup-notice{background:rgba(199,124,39,.15);border:1px solid rgba(199,124,39,.3);border-radius:10px;padding:10px 13px;font-size:12px;color:#f0b060;margin-bottom:14px;line-height:1.6}
.google-user-pill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 13px;margin-bottom:14px}
.google-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover}
.google-avatar-init{width:32px;height:32px;border-radius:50%;background:var(--bl);color:var(--bt);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-family:'DM Mono',monospace}
.google-name{font-size:13px;font-weight:500;color:#fff}
.google-email{font-size:11px;color:rgba(255,255,255,.5)}
.btn-gpill-x{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:none;color:rgba(255,255,255,.5);cursor:pointer;font-family:'DM Sans',sans-serif}
.login-theme-btn{
  width:44px;height:24px;border-radius:12px;
  border:1.5px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.1);cursor:pointer;flex-shrink:0;
  position:relative;transition:background .3s;padding:0;
  display:inline-flex;align-items:center;
}
.login-theme-btn::after{
  content:'';position:absolute;left:3px;
  width:16px;height:16px;border-radius:50%;
  background:rgba(255,255,255,.6);transition:transform .3s,background .3s;
}
body.dark .login-theme-btn{background:rgba(139,124,240,.6);border-color:rgba(139,124,240,.5)}
body.dark .login-theme-btn::after{transform:translateX(20px);background:#fff}

/* ── APP HEADER ── */
#app{display:none}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20;height:56px}
.header-brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--green));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.brand-name{font-size:15px;font-weight:600;letter-spacing:-.3px}
.header-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn-h{padding:7px 12px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-family:'DM Sans',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-h:hover{background:var(--surface2);color:var(--text)}
.btn-h.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-h.accent:hover{opacity:.9}
.rep-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-family:'DM Mono',monospace;background:var(--pl);color:var(--pt)}
.rep-badge.manager{background:linear-gradient(135deg,var(--purple),var(--green));color:#fff}
.theme-btn{
  width:44px;height:24px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface2);cursor:pointer;flex-shrink:0;
  position:relative;transition:background .3s,border-color .3s;padding:0;
  display:inline-flex;align-items:center;
}
.theme-btn::after{
  content:'';position:absolute;left:3px;
  width:16px;height:16px;border-radius:50%;
  background:var(--text3);transition:transform .3s,background .3s;
}
body.dark .theme-btn{background:var(--accent);border-color:var(--accent)}
body.dark .theme-btn::after{transform:translateX(20px);background:#fff}

/* ── NAV TABS ── */
.nav-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 18px;background:var(--surface);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:11px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text3);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .15s;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-tab .badge-count{background:var(--accent);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-family:'DM Mono',monospace}

/* ── MAIN ── */
.main{padding:16px;max-width:1000px;margin:0 auto}

/* ── DASHBOARD ── */
/* DASHBOARD HERO */
.dash-hero{
  border-radius:var(--rl2);padding:20px;margin-bottom:14px;
  background:linear-gradient(135deg,#1a1a2e 0%,#0f3460 50%,#1a1a2e 100%);
  position:relative;overflow:hidden;color:#fff;isolation:isolate;
  border:1px solid rgba(255,255,255,.08);
}
.dash-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(91,79,207,.35) 0%,transparent 60%),radial-gradient(ellipse at 80% 30%,rgba(29,158,117,.2) 0%,transparent 50%);pointer-events:none}
body.dark .dash-hero{background:linear-gradient(135deg,#0a0c18 0%,#0d1f3c 50%,#0a0c18 100%);border-color:rgba(255,255,255,.06)}
.dash-hero-content{position:relative;z-index:1}
.dash-hero h2{font-size:20px;font-weight:600;margin-bottom:3px;letter-spacing:-.3px}
.dash-hero p{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:14px}
.hero-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.hero-metric{background:rgba(255,255,255,.07);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 13px}
.hero-metric-label{font-size:10px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.5px;font-family:'DM Mono',monospace;margin-bottom:4px}
.hero-metric-value{font-size:18px;font-weight:600;color:#fff;letter-spacing:-.4px}
.hero-metric-value.green{color:#5EC994}
.hero-metric-value.red{color:#ff8080}
.hero-metric-value.teal{color:#60D9BC}

/* DASHBOARD STAT CARDS - match shop/order card style */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.dash-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--rl2);padding:16px;position:relative;overflow:hidden;
  transition:box-shadow .15s,border-color .15s;
}
.dash-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);border-color:var(--accent)}
body.dark .dash-card{background:var(--surface);border-color:var(--border)}
.dash-card-stripe{position:absolute;top:0;left:0;width:4px;height:100%;border-radius:var(--rl2) 0 0 var(--rl2)}
.dash-card.green-card .dash-card-stripe{background:var(--green)}
.dash-card.purple-card .dash-card-stripe{background:var(--purple)}
.dash-card.red-card .dash-card-stripe{background:var(--red)}
.dash-card.teal-card .dash-card-stripe{background:var(--teal)}
.dash-card-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.dash-card-icon.green{background:var(--gl);color:var(--green)}
.dash-card-icon.purple{background:var(--pl);color:var(--purple)}
.dash-card-icon.red{background:var(--rl);color:var(--red)}
.dash-card-icon.teal{background:var(--tl);color:var(--teal)}
.dash-card-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-family:'DM Mono',monospace;margin-bottom:5px}
.dash-card-value{font-size:22px;font-weight:600;letter-spacing:-.5px;color:var(--text)}
.dash-card-sub{font-size:11px;color:var(--text3);margin-top:3px}

/* ── SECTION ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.section-title{font-size:15px;font-weight:600;letter-spacing:-.2px}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;align-items:center}
.tab{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);transition:all .15s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.tab:hover,.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-wrap{position:relative;flex:1;min-width:150px}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}
.search-input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;outline:none}
.search-input:focus{border-color:var(--accent)}
.sort-sel{padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--surface);color:var(--text2);font-family:'DM Sans',sans-serif;outline:none;cursor:pointer}

/* ── SHOP CARD ── */
.shop-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:15px 16px;margin-bottom:9px;transition:box-shadow .15s;cursor:pointer}
.shop-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);border-color:var(--accent)}
.shop-card-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.shop-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--blue));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;font-family:'DM Mono',monospace}
.shop-name{font-size:14px;font-weight:600}
.shop-meta{font-size:11px;color:var(--text3);margin-top:2px}
.shop-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.shop-stat{background:var(--bg);border-radius:var(--r);padding:8px 10px;text-align:center}
.shop-stat-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-family:'DM Mono',monospace;margin-bottom:2px}
.shop-stat-val{font-size:12px;font-weight:600}
.shop-stat-val.green{color:var(--green)}
.shop-stat-val.red{color:var(--red)}
.shop-stat-val.teal{color:var(--teal)}

/* ── ORDER CARD ── */
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:15px 16px;margin-bottom:9px;transition:box-shadow .15s}
.order-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.order-num{font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);margin-bottom:2px}
.order-shop{font-size:14px;font-weight:600}
.order-meta{font-size:11px;color:var(--text3);margin-top:2px}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:'DM Mono',monospace;white-space:nowrap}
.badge.paid{background:var(--gl);color:var(--gt)}
.badge.partial{background:var(--wl);color:var(--wt)}
.badge.owing{background:var(--rl);color:var(--rt)}
.badge.credit-b{background:var(--tl);color:var(--tt)}
.badge.overdue{background:var(--red);color:#fff}
.badge.cash{background:var(--gl);color:var(--gt)}
.badge.momo{background:var(--pl);color:var(--pt)}
.badge.cheque{background:var(--bl);color:var(--bt)}
.badge.credit-pay{background:var(--tl);color:var(--tt)}
.badge.rep-b{background:var(--bl);color:var(--bt);font-size:10px}
.progress-track{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:7px 0 3px}
.progress-fill{height:100%;border-radius:3px;background:var(--green);transition:width .4s}
.progress-fill.warn{background:var(--warn)}
.progress-fill.teal-f{background:var(--teal)}
.pct{font-size:11px;color:var(--text3);text-align:right;font-family:'DM Mono',monospace}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.amount-cell{background:var(--bg);border-radius:var(--r);padding:8px 10px;text-align:center}
.amount-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-family:'DM Mono',monospace;margin-bottom:2px}
.amount-val{font-size:12px;font-weight:600}
.amount-val.green{color:var(--green)}
.amount-val.red{color:var(--red)}
.amount-val.teal{color:var(--teal)}
.amount-val.warn{color:var(--warn)}
.credit-due-banner{background:var(--tl);border:1px solid var(--teal);border-radius:var(--r);padding:8px 12px;font-size:12px;color:var(--tt);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.overdue-banner{background:var(--rl);border:1px solid var(--red);border-radius:var(--r);padding:8px 12px;font-size:12px;color:var(--rt);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.prod-table{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin:8px 0}
.prod-header{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;background:var(--surface2);padding:6px 10px;font-size:10px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.4px;color:var(--text3)}
.prod-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;padding:7px 10px;border-top:1px solid var(--border);font-size:12px;align-items:center}
.prod-row:nth-child(even){background:var(--bg)}
.prod-name{font-weight:500}
.prod-variant{font-size:10px;color:var(--text3)}
.pay-history{border-top:1px solid var(--border);margin-top:8px;padding-top:8px}
.pay-history-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-family:'DM Mono',monospace;margin-bottom:5px}
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--border)}
.pay-row:last-child{border-bottom:none}
.pay-date{color:var(--text2);font-family:'DM Mono',monospace;font-size:11px}
.pay-amt{font-weight:600;font-family:'DM Mono',monospace;color:var(--green)}
.pay-note{color:var(--text3);font-style:italic;flex:1;text-align:right;font-size:11px}
.card-actions{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.btn-a{padding:7px 12px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-family:'DM Sans',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.btn-a:hover{background:var(--surface2);color:var(--text)}
.btn-a.green{background:var(--gl);border-color:var(--green);color:var(--gt)}
.btn-a.green:hover{opacity:.85}
.btn-a.red{background:var(--rl);border-color:#f0b8b4;color:var(--rt)}
.btn-a.red:hover{opacity:.85}
.btn-a.accent{background:var(--pl);border-color:var(--purple);color:var(--pt)}
.notes-text{font-size:12px;color:var(--text3);font-style:italic;margin-bottom:7px}
.distrib-tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;margin-bottom:7px}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:13px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,20,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:var(--rl2);padding:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.form-label{display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-family:'DM Mono',monospace;margin-bottom:5px}
.form-input,.form-textarea,.form-select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--text);background:var(--bg);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent);background:var(--surface)}
.form-group{margin-bottom:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.btn-cancel{padding:9px 15px;border-radius:var(--r);font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-family:'DM Sans',sans-serif}
.btn-cancel:hover{background:var(--surface2)}
.btn-save{padding:9px 18px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif}
.btn-save:hover{opacity:.9}

/* payment method selector */
.pay-method-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pay-method-btn{padding:10px 6px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-family:'DM Sans',sans-serif;text-align:center;transition:all .2s}
.pay-method-btn.active{border-color:var(--accent);background:var(--pl);color:var(--pt)}
.credit-duration{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.credit-week-btn{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-family:'DM Sans',sans-serif;transition:all .2s}
.credit-week-btn.active{border-color:var(--teal);background:var(--tl);color:var(--tt)}

/* product builder */
.product-builder{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.product-builder-header{background:var(--surface2);padding:8px 12px;font-size:11px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);display:flex;justify-content:space-between;align-items:center}
.product-item{padding:8px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:7px;font-size:12px;flex-wrap:wrap}
.product-detail{flex:1;min-width:0}
.product-detail strong{font-weight:500;display:block}
.product-detail span{color:var(--text3);font-size:11px}
.btn-remove-prod{padding:3px 8px;border-radius:5px;font-size:11px;cursor:pointer;border:1px solid #f0b8b4;background:var(--rl);color:var(--rt);font-family:'DM Sans',sans-serif}
.add-product-row{padding:10px;background:var(--bg);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.add-prod-inner{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px}
.add-product-row input,.add-product-row select{padding:7px 9px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;outline:none;width:100%}
.add-product-row input:focus,.add-product-row select:focus{border-color:var(--accent)}
.btn-add-prod{padding:8px;border-radius:var(--r);font-size:12px;cursor:pointer;border:1px solid var(--green);background:var(--gl);color:var(--gt);font-family:'DM Sans',sans-serif;font-weight:500;width:100%}
.total-display{background:var(--surface2);border-top:1px solid var(--border);padding:8px 12px;display:flex;justify-content:space-between;font-size:13px;font-weight:600}

/* rep manage */
.rep-manage-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* balance hint */
.balance-hint{border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:13px;border:1px solid}
.balance-hint.red-h{background:var(--rl);border-color:#f0b8b4;color:var(--rt)}
.balance-hint.teal-h{background:var(--tl);border-color:var(--teal);color:var(--tt)}

/* date bar */
.date-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:11px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date-bar label{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.date-input{padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;outline:none}
.date-input:focus{border-color:var(--accent)}
.btn-date{padding:6px 11px;border-radius:var(--r);font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-family:'DM Sans',sans-serif;transition:all .15s;font-weight:500;white-space:nowrap}
.btn-date.active,.btn-date:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* dark mode active tab fix */
body.dark .nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
body.dark .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
body.dark .tab:hover{background:var(--accent);color:#fff}

/* ── OVERDUE FLASH ANIMATION ── */
@keyframes flashPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.6;transform:scale(1.02)}
}
@keyframes borderPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0.7)}
  50%{box-shadow:0 0 0 8px rgba(192,57,43,0)}
}
.overdue-flash{
  animation:flashPulse 1.5s ease-in-out infinite, borderPulse 1.5s ease-in-out infinite;
  border:2px solid var(--red) !important;
}
.overdue-dot{
  display:inline-block;
  width:10px;height:10px;border-radius:50%;
  background:var(--red);
  animation:flashPulse 1s ease-in-out infinite;
  margin-right:6px;
  vertical-align:middle;
}


/* ── ROUTE ── */
.day-tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);transition:all .2s;font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0}
.day-tab:hover{border-color:var(--accent);color:var(--accent)}
.day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.day-tab.today-tab{border-color:var(--green);color:var(--green)}
.day-tab.today-tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.route-shop-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:14px 15px;margin-bottom:8px;transition:box-shadow .15s}
.route-shop-card.visited-card{opacity:.7;border-style:dashed}
.route-shop-card.has-order{border-color:var(--green)}
.visit-note{font-size:11px;color:var(--text3);font-style:italic;margin-top:6px;padding:5px 8px;background:var(--surface2);border-radius:6px}
.rep-route-selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.rep-route-selector::-webkit-scrollbar{display:none}
.rep-route-btn{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);transition:all .15s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.rep-route-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
.assign-day-section{background:var(--surface2);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.assign-day-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-family:'DM Mono',monospace;margin-bottom:8px}
.shop-assign-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px;gap:8px}
.shop-assign-row:last-child{border-bottom:none}
.day-checkbox-row{display:flex;gap:6px;flex-wrap:wrap}
.day-chip{padding:3px 9px;border-radius:12px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-family:'DM Sans',sans-serif;transition:all .15s;user-select:none}
.day-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}


/* ── SYNC & OFFLINE ── */
.sync-btn{
  position:relative;padding:7px 12px;border-radius:var(--r);font-size:12px;
  font-weight:500;cursor:pointer;border:1px solid var(--border);
  background:var(--surface);color:var(--text2);font-family:'DM Sans',sans-serif;
  transition:all .2s;display:inline-flex;align-items:center;gap:6px;
}
.sync-btn:hover{background:var(--surface2);color:var(--text)}
.sync-btn.syncing{background:var(--bl);border-color:var(--blue);color:var(--bt)}
.sync-btn.has-pending{background:var(--wl);border-color:var(--warn);color:var(--wt)}
.sync-btn.synced{background:var(--gl);border-color:var(--green);color:var(--gt)}
.sync-badge{
  position:absolute;top:-6px;right:-6px;
  background:var(--warn);color:#fff;
  border-radius:10px;padding:1px 5px;
  font-size:10px;font-weight:700;font-family:'DM Mono',monospace;
  min-width:16px;text-align:center;
}
.offline-banner{
  background:var(--wl);border-bottom:1px solid var(--warn);
  padding:8px 18px;font-size:12px;color:var(--wt);
  display:none;align-items:center;gap:8px;
}
.offline-banner.show{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .8s linear infinite;display:inline-block}

/* DELIVERY STATUS */
.badge.pending-del{background:#FEF3E2;color:#7C4A03}
.badge.delivered{background:var(--gl);color:var(--gt)}
.delivery-section{
  background:var(--surface2);border-radius:var(--r);
  padding:10px 12px;margin:8px 0;
  border-left:3px solid var(--warn);
}
.delivery-section.delivered-section{border-left-color:var(--green)}
.delivery-label{font-size:10px;color:var(--text3);text-transform:uppercase;
  letter-spacing:.5px;font-family:'DM Mono',monospace;margin-bottom:4px}
.delivery-value{font-size:13px;font-weight:500}

/* END OF DAY REMINDER */
.eod-banner{
  position:fixed;bottom:16px;right:16px;left:16px;
  background:var(--text);color:#fff;
  border-radius:var(--rl2);padding:14px 16px;
  display:none;flex-direction:column;gap:10px;
  box-shadow:0 8px 32px rgba(0,0,0,.3);z-index:200;
}
.eod-banner.show{display:flex}
.eod-banner h4{font-size:14px;font-weight:600}
.eod-banner p{font-size:12px;color:rgba(255,255,255,.7)}
.eod-actions{display:flex;gap:8px}
.btn-eod-sync{padding:9px 16px;border-radius:var(--r);font-size:13px;font-weight:600;
  cursor:pointer;border:none;background:var(--green);color:#fff;font-family:'DM Sans',sans-serif}
.btn-eod-dismiss{padding:9px 16px;border-radius:var(--r);font-size:13px;
  cursor:pointer;border:1px solid rgba(255,255,255,.2);background:transparent;
  color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif}

/* ── PRINT ── */
@media print{
  *{-webkit-print-color-adjust:exact!important;color-adjust:exact!important}
  body{background:#fff!important;color:#000!important}
  #loginScreen,#app,.header,.nav-tabs,.filter-bar,.date-bar,.card-actions,.btn-h,#repSelector,#modalWrap{display:none!important}
  #printDoc{display:block!important}
}
#printDoc{display:none;font-family:'Courier New',monospace;font-size:13px;color:#000;background:#fff;padding:0;width:100%;max-width:72mm}
.p-company{text-align:center;font-size:15px;font-weight:bold;letter-spacing:1px;margin-bottom:2px}
.p-sub{text-align:center;font-size:11px;margin-bottom:2px}
.p-div{border:none;border-top:1px dashed #000;margin:6px 0}
.p-sec{font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 3px}
.p-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;gap:4px}
.p-row .l{color:#444;flex:1}
.p-row .v{font-weight:bold;text-align:right;white-space:nowrap}
.p-prod{font-size:11px;margin-bottom:3px;padding-bottom:3px;border-bottom:1px dotted #ccc}
.p-prod-name{font-weight:bold}
.p-prod-detail{display:flex;justify-content:space-between;color:#333}
.p-total{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;margin-top:4px;padding-top:4px;border-top:1px solid #000}
.p-pay-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px dotted #ddd}
.p-status{text-align:center;font-size:14px;font-weight:bold;border:2px solid #000;padding:5px;margin:8px 0;letter-spacing:1px}
.p-footer{text-align:center;font-size:10px;color:#555;margin-top:6px}
.p-gra{text-align:center;font-size:10px;border:1px solid #000;padding:4px;margin-top:6px;font-style:italic}
.p-block{page-break-after:always;padding-bottom:10px;margin-bottom:10px;border-bottom:2px dashed #000}
.p-block:last-child{page-break-after:auto;border-bottom:none}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .header{height:auto;padding:10px 14px;gap:8px}
  .header-brand .brand-name{font-size:14px}
  .btn-h{padding:6px 9px;font-size:11px}
  .main{padding:10px}
  .amounts{grid-template-columns:1fr 1fr}
  .hero-metrics{grid-template-columns:1fr 1fr}
  .prod-header{display:none}
  .prod-row{grid-template-columns:1fr;gap:2px;font-size:11px}
  .add-prod-inner{grid-template-columns:1fr 1fr}

  .modal-overlay{align-items:flex-end;padding:0}
  .form-row{grid-template-columns:1fr}
  .modal-footer{flex-direction:column-reverse}
  .btn-save,.btn-cancel{width:100%;text-align:center;justify-content:center;padding:12px}
  .btn-a{flex:1;justify-content:center}
}
@media(hover:none){
  .btn-a,.btn-h,.tab,.nav-tab,.btn-date,.btn-save,.btn-cancel,.btn-login{min-height:44px}
  .form-input,.form-textarea,.form-select,.date-input,.search-input,.sort-sel,.login-input{font-size:16px!important}
}

<script>
const GOOGLE_CLIENT_ID = '470638059581-rtno2bifum3b4ki1cv86ij6nn7ojoc1s.apps.googleusercontent.com';
const API_URL = 'https://sale-rep-api.onrender.com';
let authToken = null;
const DISTRIBUTORS = ['AMATA','DADDY ASH'];
function getId(obj){ return obj._id || obj.id || ''; }

// ── API HELPERS ──
async function api(path, method='GET', body=null){
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if(authToken) opts.headers['Authorization'] = 'Bearer ' + authToken;
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(API_URL + path, opts);
  if(!res.ok){ const err = await res.json().catch(()=>({error:'Network error'})); throw new Error(err.error||'Request failed'); }
  return res.json();
}

// Keep localStorage as cache
function ld(){return JSON.parse(localStorage.getItem('mkt5')||'{"users":[],"shops":[],"orders":[],"visits":[]}');}
function sd(d){localStorage.setItem('mkt5',JSON.stringify(d));}

// Load all data from API into local cache
async function loadFromAPI(){
  try {
    const [users, shops, orders, visits] = await Promise.all([
      api('/api/users'),
      api('/api/shops'),
      api('/api/orders'),
      api('/api/visits')
    ]);
    const d = { users, shops, orders, visits };
    sd(d);
    return d;
  } catch(e) {
    console.warn('API load failed, using cache:', e.message);
    return ld();
  }
}

function init(){
  let d=ld();
  if(!d.shops)d.shops=[];
  if(!d.orders)d.orders=[];
  if(!d.visits)d.visits=[];
  if(!d.users)d.users=[];
  return d;
}

let CU=null,VR=null,PAGE='dashboard',DF={mode:'all',from:null,to:null};
let routeDay=null,routeRepId=null;
let tmpProds=[],loginRole='admin';
let googleUser=null,driveFileId=null;

// -- HELPERS --
function fmt(n){return 'GH\u20B5 '+Number(n).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function ini(n){return n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function today(){return new Date().toISOString().slice(0,10);}
function weekStart(){const d=new Date();d.setDate(d.getDate()-d.getDay());return d.toISOString().slice(0,10);}
function monthStart(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;}
function addDays(ds,n){const d=new Date(ds);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function isOverdue(o){if(o.paymentType!=='credit'||!o.creditDue)return false;return balanceAmt(o)>0&&today()>o.creditDue;}
function orderTotal(o){return o.products?o.products.reduce((a,p)=>a+p.qty*p.unitPrice,0):0;}
function totalPaid(o){return o.payments?o.payments.reduce((a,p)=>a+Number(p.amount),0):0;}
function creditAmt(o){return Math.max(0,totalPaid(o)-orderTotal(o));}
function balanceAmt(o){return Math.max(0,orderTotal(o)-totalPaid(o));}
function getStatus(o){
  const paid=totalPaid(o),owed=orderTotal(o);
  if(paid>owed)return 'credit';
  if(paid<=0)return 'owing';
  if(paid>=owed)return 'paid';
  return 'partial';
}
function inRange(ds){
  if(!ds)return true;
  const {mode,from,to}=DF;
  if(mode==='all')return true;
  if(mode==='today')return ds===today();
  if(mode==='week')return ds>=weekStart()&&ds<=today();
  if(mode==='month')return ds>=monthStart()&&ds<=today();
  if(mode==='range'){if(from&&ds<from)return false;if(to&&ds>to)return false;return true;}
  return true;
}
function orderInRange(o){if(DF.mode==='all')return true;if(inRange(o.date))return true;return(o.payments||[]).some(p=>inRange(p.date));}
function paysInRange(o){return DF.mode==='all'?o.payments:(o.payments||[]).filter(p=>inRange(p.date));}
function paidInRange(o){return paysInRange(o).reduce((a,p)=>a+Number(p.amount),0);}
function nextOrderNum(){const d=ld();const n=(d.orders||[]).length+1;return 'ORD-'+String(n).padStart(4,'0');}

// -- GOOGLE --
function isGCfg(){return GOOGLE_CLIENT_ID!=='YOUR_GOOGLE_CLIENT_ID'&&GOOGLE_CLIENT_ID.length>10;}
function checkSetupNotice(){const n=document.getElementById('setupNotice');if(n)n.style.display=isGCfg()?'none':'block';}
function triggerGoogleSignIn(){
  if(!isGCfg()){alert('Google Sign-In not configured yet.\nUse username/password login below.');return;}
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleGoogleCredential,auto_select:false});
  google.accounts.id.prompt();
}
async function handleGoogleCredential(response){
  const payload=parseJwt(response.credential);
  googleUser={name:payload.name,email:payload.email,picture:payload.picture,token:response.credential};
  showGooglePill(googleUser);
  try {
    const res = await api('/api/login/google','POST',{email:payload.email});
    authToken = res.token;
    localStorage.setItem('mkt5_token', authToken);
    await loadFromAPI();
    completeLogin(res.user);
  } catch(e) {
    document.getElementById('loginErr').textContent='No account linked to this Google email. Use password login or ask your manager to link your email.';
    document.getElementById('loginErr').style.display='block';
  }
}
function showGooglePill(gu){
  const pill=document.getElementById('googleUserPill');
  const in2=gu.name.trim().split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  pill.innerHTML=`<div class="google-user-pill"><div class="google-avatar-init">${in2}</div><div><div class="google-name">${gu.name}</div><div class="google-email">${gu.email}</div></div><button class="btn-gpill-x" onclick="clearGoogleUser()">x</button></div>`;
  pill.style.display='block';document.getElementById('btnGoogleSignIn').style.display='none';
}
function clearGoogleUser(){googleUser=null;document.getElementById('googleUserPill').style.display='none';document.getElementById('btnGoogleSignIn').style.display='flex';}
function parseJwt(token){const b=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(b));}
async function saveToDrive(data){
  if(!googleUser||!isGCfg())return;
  try{
    const token=await getAccessToken();if(!token)return;
    const content=JSON.stringify(data);
    if(driveFileId){await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:content});}
    else{const meta=await fetch('https://www.googleapis.com/drive/v3/files?q=name%3D%27mkt5_data.json%27+and+trashed%3Dfalse',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json());
      if(meta.files&&meta.files.length){driveFileId=meta.files[0].id;await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:content});}
      else{const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'multipart/related; boundary=bound'},body:'--bound\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({name:'mkt5_data.json',mimeType:'application/json'})+'\r\n--bound\r\nContent-Type: application/json\r\n\r\n'+content+'\r\n--bound--'}).then(r=>r.json());driveFileId=res.id;}}
  }catch(e){console.warn('Drive sync:',e);}
}
async function getAccessToken(){return new Promise(resolve=>{if(!isGCfg()){resolve(null);return;}google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>resolve(r.access_token)}).requestAccessToken({prompt:''});});}

function setLoginRole(r){loginRole=r;document.getElementById('roleAdminBtn').classList.toggle('active',r==='admin');document.getElementById('roleRepBtn').classList.toggle('active',r==='rep');}
async function completeLogin(user){
  if(!user)return;
  document.getElementById('loginErr').style.display='none';
  const uid = user._id || user.id;
  CU={...user, id: uid};
  VR=user.role==='manager'?null:uid;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userBadge').textContent=user.name+(user.role==='manager'?' (Manager)':'');
  if(user.role==='manager'){document.getElementById('userBadge').classList.add('manager');document.getElementById('manageRepsBtn').style.display='inline-flex';}
  else{document.getElementById('manageRepsBtn').style.display='none';}
  saveSession({...user,id:uid});pushAppState();
  // Load fresh data from API
  await loadFromAPI();
  setPage('dashboard',document.querySelector('.nav-tab'));
  updateSyncBtn();
  // Check if offline
  if(!navigator.onLine){
    document.getElementById('offlineBanner').classList.add('show');
  }
  // Check EOD on login
  setTimeout(checkEODReminder, 5000);
}
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  if(!u||!p){document.getElementById('loginErr').textContent='Please enter username and password.';document.getElementById('loginErr').style.display='block';return;}
  const btn=document.querySelector('.btn-login');
  btn.textContent='Signing in...';btn.disabled=true;
  try {
    const res = await api('/api/login','POST',{username:u,password:p});
    authToken = res.token;
    localStorage.setItem('mkt5_token', authToken);
    await loadFromAPI();
    completeLogin(res.user);
  } catch(e) {
    document.getElementById('loginErr').textContent=e.message||'Incorrect username or password.';
    document.getElementById('loginErr').style.display='block';
  } finally {
    btn.textContent='Sign In →';btn.disabled=false;
  }
}
function logout(){
  CU=null;VR=null;PAGE='dashboard';DF={mode:'all',from:null,to:null};
  authToken=null;localStorage.removeItem('mkt5_token');
  googleUser=null;driveFileId=null;clearSession();clearGoogleUser();

}
function saveSession(u){sessionStorage.setItem('mkt5_sess',JSON.stringify({id:u.id,username:u.username}));}
function loadSession(){try{const s=sessionStorage.getItem('mkt5_sess');if(!s)return null;const sess=JSON.parse(s);const d=init();return d.users.find(u=>u.id===sess.id&&u.username===sess.username)||null;}catch(e){return null;}}
function clearSession(){sessionStorage.removeItem('mkt5_sess');}
function pushAppState(){history.pushState({app:true},'',window.location.href);}
window.addEventListener('popstate',function(e){

function orderCardHTML(o,shopMap,repMap){

  const owed=orderTotal(o),paid=totalPaid(o),bal=balanceAmt(o),credit=creditAmt(o);

  const pays=paysInRange(o);
  const overdue=isOverdue(o);
  const statusLabel=s==='owing'?'OWING':s==='partial'?'PART PAID':s==='credit'?'CREDIT BALANCE':'FULLY PAID';
  const badgeClass=overdue?'overdue':s==='paid'?'paid':s==='partial'?'partial':s==='credit'?'credit-b':'owing';
  const payTypeBadge=o.paymentType?`<span class="badge ${o.paymentType==='cash'?'cash':o.paymentType==='momo'?'momo':o.paymentType==='cheque'?'cheque':'credit-pay'}">${o.paymentType==='cash'?'CASH':o.paymentType==='momo'?'MOMO':o.paymentType==='cheque'?'CHEQUE':'CREDIT'}</span>`:'';
  const repBadge=CU.role==='manager'?`<span class="badge rep-b">${repMap[o.repId]||'?'}</span>`:'';
  const prodsHTML=o.products&&o.products.length?`<div class="prod-table">

    <div class="total-display"><span>Invoice Total</span><span>${fmt(owed)}</span></div>

  const histRows=pays.slice().reverse().slice(0,4).map(p=>`<div class="pay-row"><span class="pay-date">${p.date}</span><span class="pay-amt">${fmt(p.amount)}</span>${p.note?`<span class="pay-note">${p.note}</span>`:'<span></span>'}</div>`).join('');
  const morePays=pays.length>4?`<div style="font-size:11px;color:var(--text3);margin-top:3px">+${pays.length-4} more</div>`:'';
  const actions=CU.role!=='manager'?`<button class="btn-a green" onclick="openModal('pay','${o.id}')"> Record Payment</button>
    <button class="btn-a" onclick="openModal('editOrder','${o.id}')"> Edit</button>`:'';
  return`<div class="order-card ${overdue?'overdue-flash':''}">
    <div class="order-top">
      <div>
        <div class="order-num">${o.orderNum} \u00B7 ${o.date}</div>
        <div class="order-shop">${sh?sh.name:'Unknown Shop'} ${repBadge}</div>
        <div class="order-meta">${sh?sh.location||'':''} ${sh&&sh.owner?'\u00B7 '+sh.owner:''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="badge ${badgeClass}">${overdue?'OVERDUE':statusLabel}</span>
        ${payTypeBadge}
        ${o.deliveryStatus==='delivered'?'<span class="badge delivered">&#x1F69A; Delivered</span>':'<span class="badge pending-del">&#x23F3; Pending Delivery</span>'}
      </div>
    </div>
    ${o.distributor?`<div class="distrib-tag"> ${o.distributor}</div>`:''}
    ${overdue?`<div class="overdue-banner">! Credit overdue! Due date was ${o.creditDue}. Balance: ${fmt(bal)}</div>`:''}
    ${s==='credit'?`<div class="credit-due-banner">$ Overpaid by ${fmt(credit)} \u2014 credit held for next order</div>`:''}

    <div class="progress-track"><div class="progress-fill ${s==='partial'?'warn':s==='credit'?'teal-f':''}" style="width:${pct}%"></div></div>
    <div class="pct">${pct}% paid</div>
    <div class="amounts">
      <div class="amount-cell"><div class="amount-lbl">Invoiced</div><div class="amount-val">${fmt(owed)}</div></div>
      <div class="amount-cell"><div class="amount-lbl">Paid</div><div class="amount-val green">${fmt(DF.mode!=='all'?paidR:paid)}</div></div>

const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'];
function todayDayName(){const d=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];return d[new Date().getDay()];}

function renderRoute(){
  const d=ld();
  const repMap={};d.users.forEach(u=>repMap[u.id]=u.name);
  const reps=d.users.filter(u=>u.role==='rep');
  // set default routeRepId
  if(!routeRepId){
    if(CU.role==='rep')routeRepId=CU.id;
    else if(reps.length)routeRepId=reps[0].id;
  }
  if(!routeDay)routeDay=todayDayName()==='Saturday'||todayDayName()==='Sunday'?'Monday':todayDayName();

  const repSelectorHTML=CU.role==='manager'?`<div class="rep-route-selector">
    <span style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">Rep:</span>
    ${reps.map(r=>`<button class="rep-route-btn ${routeRepId===r.id?'active':''}" onclick="routeRepId='${r.id}';renderPage()">${r.name}</button>`).join('')}
  </div>`:'';

  const todayName=todayDayName();
  const dayTabsHTML=`<div class="day-tabs">
    ${DAYS.map(day=>`<button class="day-tab ${routeDay===day?'active':''} ${day===todayName?'today-tab':''}" onclick="routeDay='${day}';renderPage()">
      ${day===todayName?' ':''} ${day}${day===todayName?' (Today)':''}
    </button>`).join('')}
  </div>`;

  // get shops assigned to this rep+day
  const repId=routeRepId||CU.id;
  const allShops=d.shops.filter(s=>s.repId===repId);
  const dayShops=allShops.filter(s=>s.routeDays&&s.routeDays.includes(routeDay));
  const otherDayShops=DAYS.filter(day=>day!==routeDay).map(day=>({
    day,shops:allShops.filter(s=>s.routeDays&&s.routeDays.includes(day))
  })).filter(x=>x.shops.length);

  // today's visits & orders
  const todayStr=today();
  const todayOrders=d.orders.filter(o=>o.repId===repId&&o.date===todayStr);
  const visits=d.visits||[];
  const todayVisits=visits.filter(v=>v.repId===repId&&v.date===todayStr);

  const shopCardHTML=(s,fromDay)=>{
    const hasOrder=todayOrders.some(o=>o.shopId===s.id);
    const visitEntry=todayVisits.find(v=>v.shopId===s.id);
    const isVisited=!!visitEntry;
    const shopOrders=d.orders.filter(o=>o.shopId===s.id);
    const sBal=shopOrders.reduce((a,o)=>a+balanceAmt(o),0);
    return`<div class="route-shop-card ${isVisited&&!hasOrder?'visited-card':''} ${hasOrder?'has-order':''}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <div class="shop-avatar" style="width:34px;height:34px;font-size:11px">${ini(s.name)}</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600">${s.name}</div>
          <div style="font-size:11px;color:var(--text3)">${s.location||''} ${s.owner?'\u00B7 '+s.owner:''}</div>
        </div>
        ${hasOrder?`<span class="badge paid"> ORDER</span>`:isVisited?`<span class="badge partial">VISITED</span>`:''}
        ${fromDay?`<span style="font-size:10px;background:var(--pl);color:var(--pt);padding:2px 7px;border-radius:10px;font-family:'DM Mono',monospace">${fromDay}</span>`:''}
      </div>
      ${sBal>0?`<div style="font-size:11px;color:var(--red);font-family:'DM Mono',monospace;margin-bottom:6px">Outstanding balance: ${fmt(sBal)}</div>`:''}
      ${visitEntry&&visitEntry.note?`<div class="visit-note"> No sale: ${visitEntry.note}</div>`:''}
      ${!hasOrder&&!isVisited&&(CU.role==='rep'||routeRepId===CU.id||CU.role==='manager')?`<div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn-a green" onclick="openOrderForShop('${s.id}')"> Place Order</button>
        <button class="btn-a" onclick="markVisitedNoSale('${s.id}','${s.name}')"> Visited \u2014 No Sale</button>
      </div>`:''}
      ${hasOrder?`<div style="font-size:11px;color:var(--green);margin-top:4px"> Order placed today</div>`:''}
    </div>`;
  };

  const mainShopsHTML=dayShops.length
    ?dayShops.map(s=>shopCardHTML(s,null)).join('')
    :`<div class="empty">No shops assigned to ${routeDay}.<br>${CU.role==='manager'?'Click " Assign Route" to assign shops.':'Ask your manager to assign shops to your route.'}</div>`;

  const otherDaysHTML=otherDayShops.length&&CU.role==='rep'?`
    <div style="margin-top:18px">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text2)">Other Days \u2014 Sell to any shop:</div>
      ${otherDayShops.map(({day,shops})=>`
        <div style="margin-bottom:14px">
          <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-family:'DM Mono',monospace;color:var(--text3);margin-bottom:6px">${day}</div>
          ${shops.map(s=>shopCardHTML(s,day)).join('')}
        </div>`).join('')}
    </div>`:'';

  const summaryHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:11px 13px;text-align:center">
      <div style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Today's Shops</div>
      <div style="font-size:18px;font-weight:600">${dayShops.length}</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:11px 13px;text-align:center">
      <div style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Orders Today</div>
      <div style="font-size:18px;font-weight:600;color:var(--green)">${todayOrders.length}</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:11px 13px;text-align:center">
      <div style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">No Sale Visits</div>
      <div style="font-size:18px;font-weight:600;color:var(--warn)">${todayVisits.length}</div>
    </div>
  </div>`;

  return`<div style="margin-bottom:4px">
    ${repSelectorHTML}
    ${CU.role==='manager'?`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div class="section-title"> Route Plan \u2014 ${repMap[repId]||'Rep'}</div>
      <button class="btn-h accent" onclick="openModal('assignRoute')"> Assign Shops to Days</button>
    </div>`:`<div class="section-title" style="margin-bottom:12px"> My Route \u2014 ${routeDay}</div>`}
    ${summaryHTML}
    ${dayTabsHTML}
    ${mainShopsHTML}
    ${otherDaysHTML}
  </div>`;
}


async function toggleShopDay(shopId,day,el){
  const d=ld();
  const shop=d.shops.find(s=>(s.id||s._id)===shopId);
  if(!shop.routeDays)shop.routeDays=[];
  if(shop.routeDays.includes(day)){
    shop.routeDays=shop.routeDays.filter(x=>x!==day);
    el.classList.remove('active');
  } else {
    shop.routeDays.push(day);
    el.classList.add('active');
  }
  try {
    await api('/api/shops/'+shopId,'PUT',{routeDays:shop.routeDays});
    sd(d);
  } catch(e){ console.warn('Route day update failed:',e.message); }
}

function markVisitedNoSale(shopId,shopName){
  const note=prompt(`Visited ${shopName} with no sale today. Add a reason (optional):`,'');
  if(note===null)return; // cancelled
  const d=ld();
  if(!d.visits)d.visits=[];
  // remove existing visit for this shop today if any
  d.visits=d.visits.filter(v=>!(v.shopId===shopId&&v.repId===CU.id&&v.date===today()));
  d.visits.push({id:Date.now().toString(),repId:CU.id,shopId,date:today(),note:note.trim()});
  sd(d);renderPage();
}


async function delShop(id){if(!confirm('Delete this shop? All its orders will remain.'))return;try{await api('/api/shops/'+id,'DELETE');const d=ld();d.shops=d.shops.filter(s=>(s.id||s._id)!==id);sd(d);renderPage();}catch(e){alert('Error: '+e.message);}}
async function delOrder(id){if(!confirm('Delete this order?'))return;try{await api('/api/orders/'+id,'DELETE');const d=ld();d.orders=d.orders.filter(o=>(o.id||o._id)!==id);sd(d);renderPage();}catch(e){alert('Error: '+e.message);}}

function addProdToList(){
  const name=document.getElementById('np_name').value.trim();
  const variant=document.getElementById('np_variant').value.trim();
  const qty=parseFloat(document.getElementById('np_qty').value);
  const unit=document.getElementById('np_unit').value;
  const price=parseFloat(document.getElementById('np_price').value);
  if(!name||isNaN(qty)||qty<=0||isNaN(price)||price<0){alert('Please fill product name, quantity and unit price.');return;}
  tmpProds.push({name,variant,qty,unit,unitPrice:price});
  document.getElementById('np_name').value='';document.getElementById('np_variant').value='';document.getElementById('np_qty').value='';document.getElementById('np_price').value='';
  renderTmpProds();
}
function removeProd(i){tmpProds.splice(i,1);renderTmpProds();}

async function saveShop(){
  const name=document.getElementById('s_name').value.trim();
  if(!name){alert('Please enter a shop name.');return;}
  const shopData={name,owner:document.getElementById('s_owner').value.trim(),
    contact:document.getElementById('s_contact').value.trim(),
    location:document.getElementById('s_location').value.trim(),
    tin:document.getElementById('s_tin').value.trim(),
    creditLimit:parseFloat(document.getElementById('s_credit').value)||0,
    notes:document.getElementById('s_notes').value.trim()};
  const localId='local_'+Date.now();
  const localShop={...shopData,_localId:localId,_id:localId,id:localId,repId:CU.id};
  const d=ld();
  if(!isOnline||!authToken){
    d.shops.push(localShop);sd(d);
    addToQueue({type:'CREATE_SHOP',localId,data:shopData});
    closeModal();renderPage();return;
  }
  try {
    const shop = await api('/api/shops','POST',shopData);
    d.shops.push(shop);sd(d);
  } catch(e){
    d.shops.push(localShop);sd(d);
    addToQueue({type:'CREATE_SHOP',localId,data:shopData});
  }
  closeModal();renderPage();
}
async function updateShop(id){
  try {
    const updated = await api('/api/shops/'+id,'PUT',{
      name:document.getElementById('s_name').value.trim(),
      owner:document.getElementById('s_owner').value.trim(),
      contact:document.getElementById('s_contact').value.trim(),
      location:document.getElementById('s_location').value.trim(),
      tin:document.getElementById('s_tin').value.trim(),
      creditLimit:parseFloat(document.getElementById('s_credit').value)||0,
      notes:document.getElementById('s_notes').value.trim(),
    });
    const d=ld();const idx=d.shops.findIndex(x=>(x.id||x._id)===id);
    if(idx>-1)d.shops[idx]=updated;sd(d);closeModal();renderPage();
  } catch(e){ alert('Error: '+e.message); }
}

async function saveOrder(){
  const shopId=document.getElementById('o_shop').value;
  if(!shopId){alert('Please select a shop.');return;}
  if(tmpProds.length===0){alert('Please add at least one product.');return;}
  const initPay=parseFloat(document.getElementById('o_initpay').value)||0;
  const orderDate=document.getElementById('o_date').value||today();
  const creditDue=selectedPayMethod==='credit'?addDays(orderDate,selectedCreditWeeks*7):null;
  const payments=[];
  if(initPay>0)payments.push({amount:initPay,date:orderDate,note:selectedPayMethod==='credit'?'Initial deposit':selectedPayMethod});
  const orderData={
    shopId,
    distributor:document.getElementById('o_distrib').value,
    products:JSON.parse(JSON.stringify(tmpProds)),
    date:orderDate,
    paymentType:selectedPayMethod,
    creditWeeks:selectedPayMethod==='credit'?selectedCreditWeeks:null,
    creditDue,
    notes:document.getElementById('o_notes').value.trim(),
    payments,
    deliveryStatus:'pending'
  };
  const localId='local_'+Date.now();
  const localOrder={...orderData,_localId:localId,_id:localId,id:localId,
    orderNum:'ORD-PENDING',repId:CU.id,createdAt:new Date().toISOString()};
  const d=ld();
  if(!isOnline||!authToken){
    // Save locally and queue
    d.orders.unshift(localOrder);sd(d);
    addToQueue({type:'CREATE_ORDER',localId,data:orderData});
    closeModal();PAGE='orders';
    document.querySelectorAll('.nav-tab').forEach((t,i)=>{t.classList.remove('active');if(i===2)t.classList.add('active');});
    renderPage();
    return;
  }
  try {
    const order = await api('/api/orders','POST',orderData);
    d.orders.unshift(order);sd(d);
    closeModal();PAGE='orders';
    document.querySelectorAll('.nav-tab').forEach((t,i)=>{t.classList.remove('active');if(i===2)t.classList.add('active');});
    renderPage();
  } catch(e){
    // Network failed - save locally
    d.orders.unshift(localOrder);sd(d);
    addToQueue({type:'CREATE_ORDER',localId,data:orderData});
    closeModal();PAGE='orders';
    document.querySelectorAll('.nav-tab').forEach((t,i)=>{t.classList.remove('active');if(i===2)t.classList.add('active');});
    renderPage();
  }
}
async function updateOrder(id){
  if(tmpProds.length===0){alert('Please add at least one product.');return;}
  try {
    const d=ld();const o=d.orders.find(x=>(x.id||x._id)===id);
    const updated = await api('/api/orders/'+id,'PUT',{
      shopId:document.getElementById('o_shop').value||o.shopId,
      distributor:document.getElementById('o_distrib').value,
      date:document.getElementById('o_date').value||o.date,
      products:JSON.parse(JSON.stringify(tmpProds)),
      notes:document.getElementById('o_notes').value.trim()
    });
    const idx=d.orders.findIndex(x=>(x.id||x._id)===id);
    if(idx>-1)d.orders[idx]=updated;sd(d);closeModal();renderPage();
  } catch(e){ alert('Error: '+e.message); }
}
async function addPayment(id){
  const amount=parseFloat(document.getElementById('p_amount').value);
  const date=document.getElementById('p_date').value;
  if(!amount||amount<=0||!date){alert('Please enter a valid amount and date.');return;}
  const payData={amount,date,note:document.getElementById('p_note').value.trim()};
  const d=ld();
  const idx=d.orders.findIndex(x=>(x.id||x._id)===id);
  if(idx>-1){
    if(!d.orders[idx].payments)d.orders[idx].payments=[];
    d.orders[idx].payments.push(payData);
    sd(d);
  }
  if(!isOnline||!authToken){
    addToQueue({type:'ADD_PAYMENT',id,data:payData});
    closeModal();renderPage();return;
  }
  try {
    const updated = await api('/api/orders/'+id+'/payments','POST',payData);
    if(idx>-1)d.orders[idx]=updated;sd(d);
  } catch(e){
    addToQueue({type:'ADD_PAYMENT',id,data:payData});
  }
  closeModal();renderPage();
}
async function addRep(){
  const name=document.getElementById('nr_name').value.trim();
  const username=document.getElementById('nr_user').value.trim().toLowerCase();
  const password=document.getElementById('nr_pass').value;
  const email=document.getElementById('nr_email').value.trim().toLowerCase();
  if(!name||!username||!password){alert('Please fill name, username and password.');return;}
  try {
    const newRep = await api('/api/users','POST',{name,username,password,email});
    console.log('Rep created:', newRep);
    const d=ld();
    if(!d.users)d.users=[];
    d.users.push(newRep);
    sd(d);
    closeModal();openModal('reps');
    alert('Rep added!\nUsername: '+username+'\nPassword: '+password+'\n\nThey can now log in from any device!');
  } catch(e){ 
    console.error('Add rep error:', e);
    alert('Error adding rep: '+e.message); 
  }
}
async function deleteRep(id){
  if(!confirm('Remove rep? Their data remains.'))return;
  try {
    await api('/api/users/'+id,'DELETE');
    const d=ld();d.users=d.users.filter(u=>(u.id||u._id)!==id);sd(d);
    closeModal();renderPage();
  } catch(e){ alert('Error: '+e.message); }
}
function editRepEmail(id,current){
  const email=prompt('Enter Google email for this rep:',current||'');
  if(email===null)return;
  const d=ld();const rep=d.users.find(u=>u.id===id);rep.email=email.trim().toLowerCase();
  sd(d);closeModal();openModal('reps');

function saveMgrEmail(){
  const email=document.getElementById('mgr_email').value.trim().toLowerCase();
  const d=ld();const mgr=d.users.find(u=>u.role==='manager');mgr.email=email;

// -- EXCEL EXPORT --
function exportExcel(){
  if(typeof XLSX==='undefined'){alert('Excel library not loaded yet. Please try again in a moment.');return;}
  const d=ld();
  const repMap={};d.users.forEach(u=>repMap[u.id]=u.name);
  const shopMap={};d.shops.forEach(s=>shopMap[s.id]=s);
  const reps=d.users.filter(u=>u.role==='rep');

  // which orders to include
  let allOrders=d.orders.filter(o=>CU.role==='rep'?o.repId===CU.id:(!VR||o.repId===VR));

  const wb=XLSX.utils.book_new();
  const today=new Date().toLocaleDateString('en-GH',{year:'numeric',month:'long',day:'numeric'});
  const todayISO=new Date().toISOString().slice(0,10);
  const fmt=(n)=>'GH\u20B5 '+Number(n).toFixed(2);

  // -- HELPER: style header row --
  function styleSheet(ws, headerRow, nCols){
    if(!ws['!cols'])ws['!cols']=[];
    // cell styles via !ref only (SheetJS CE doesn't support full styles but we set col widths)
  }

  // -- SHEET 1: SUMMARY --
  const summaryRows=[];
  summaryRows.push(['SALES REP PERFORMANCE REPORT','','','','','','','']);
  summaryRows.push([`Generated: ${today}`,'','','','','','','']);
  summaryRows.push([]);

  // Daily
  summaryRows.push(['DAILY DAILY SALES SUMMARY','','','','','','','']);
  summaryRows.push(['Rep Name','Date','Shop / Store','Location','Products','Payment Type','Invoiced (GH\u20B5)','Paid (GH\u20B5)','Balance (GH\u20B5)']);
  let dailyInv=0,dailyPaid=0;
  allOrders.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(o=>{
    const sh=shopMap[o.shopId];
    const prods=o.products?o.products.map(p=>`${p.name}${p.variant?' ('+p.variant+')':''} x${p.qty}${p.unit}`).join(', '):'';
    const inv=totalOwed(o),paid=totalPaid(o),bal=balanceAmt(o);
    dailyInv+=inv;dailyPaid+=paid;
    summaryRows.push([repMap[o.repId]||'-',o.date,sh?sh.name:'-',sh?sh.location||'-':'-',prods,(o.paymentType||'').toUpperCase(),inv,paid,bal]);
  });
  summaryRows.push(['','','','','','DAILY TOTALS',dailyInv,dailyPaid,dailyInv-dailyPaid]);
  summaryRows.push([]);

  // Weekly
  summaryRows.push(['WEEKLY WEEKLY SALES SUMMARY','','','','','','','']);
  summaryRows.push(['Rep Name','Week','Week Start','Week End','Shops Visited','Orders','Invoiced (GH\u20B5)','Collected (GH\u20B5)','Outstanding (GH\u20B5)']);
  // group by rep and week
  const weekGroups={};
  allOrders.forEach(o=>{
    const dt=new Date(o.date);
    const dayOfWeek=dt.getDay();
    const monday=new Date(dt);monday.setDate(dt.getDate()-(dayOfWeek===0?6:dayOfWeek-1));
    const friday=new Date(monday);friday.setDate(monday.getDate()+4);
    const wk=monday.toISOString().slice(0,10);
    const key=`${o.repId}__${wk}`;
    if(!weekGroups[key])weekGroups[key]={repId:o.repId,weekStart:wk,weekEnd:friday.toISOString().slice(0,10),orders:[],shops:new Set()};
    weekGroups[key].orders.push(o);
    if(o.shopId)weekGroups[key].shops.add(o.shopId);
  });
  let wkInv=0,wkPaid=0;
  Object.values(weekGroups).sort((a,b)=>b.weekStart.localeCompare(a.weekStart)).forEach((wg,i)=>{
    const inv=wg.orders.reduce((a,o)=>a+totalOwed(o),0);
    const paid=wg.orders.reduce((a,o)=>a+totalPaid(o),0);
    wkInv+=inv;wkPaid+=paid;
    const wkNum=`Week ${Math.ceil((new Date(wg.weekStart)-new Date(new Date(wg.weekStart).getFullYear(),0,1))/(7*24*60*60*1000))}`;
    summaryRows.push([repMap[wg.repId]||'-',wkNum,wg.weekStart,wg.weekEnd,wg.shops.size,wg.orders.length,inv,paid,inv-paid]);
  });
  summaryRows.push(['','','','','','WEEKLY TOTALS',wkInv,wkPaid,wkInv-wkPaid]);
  summaryRows.push([]);

  // Monthly
  summaryRows.push(['MONTHLY MONTHLY SALES SUMMARY','','','','','','','']);
  summaryRows.push(['Rep Name','Month','Year','Shops Visited','Orders','Invoiced (GH\u20B5)','Collected (GH\u20B5)','Outstanding (GH\u20B5)']);
  const monthGroups={};
  allOrders.forEach(o=>{
    const dt=new Date(o.date);
    const key=`${o.repId}__${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    if(!monthGroups[key])monthGroups[key]={repId:o.repId,year:dt.getFullYear(),month:dt.toLocaleString('en-GH',{month:'long'}),orders:[],shops:new Set()};
    monthGroups[key].orders.push(o);
    if(o.shopId)monthGroups[key].shops.add(o.shopId);
  });
  let mInv=0,mPaid=0;
  Object.values(monthGroups).sort((a,b)=>{const ka=`${a.year}${a.month}`,kb=`${b.year}${b.month}`;return kb.localeCompare(ka);}).forEach(mg=>{
    const inv=mg.orders.reduce((a,o)=>a+totalOwed(o),0);
    const paid=mg.orders.reduce((a,o)=>a+totalPaid(o),0);
    mInv+=inv;mPaid+=paid;
    summaryRows.push([repMap[mg.repId]||'-',mg.month,mg.year,mg.shops.size,mg.orders.length,inv,paid,inv-paid]);
  });
  summaryRows.push(['','','','','MONTHLY TOTALS',mInv,mPaid,mInv-mPaid]);

  const wsSummary=XLSX.utils.aoa_to_sheet(summaryRows);
  wsSummary['!cols']=[{wch:20},{wch:14},{wch:22},{wch:16},{wch:35},{wch:14},{wch:16},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb,wsSummary,'Summary');

  // -- SHEET PER REP --
  const repList=CU.role==='rep'?[CU]:reps;

    const repOrders=d.orders.filter(o=>o.repId===rep.id).sort((a,b)=>b.date.localeCompare(a.date));
