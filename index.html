    rows.push([`Generated: ${today}`,'','','','','','','','']);
    rows.push([]);
    rows.push(['#','Order No.','Date','Shop / Store','Location','Products Sold','Payment Type','Invoiced (GH\u20B5)','Paid (GH\u20B5)','Balance (GH\u20B5)','Credit Due']);
    let rInv=0,rPaid=0;
    repOrders.forEach((o,i)=>{
      const sh=shopMap[o.shopId];
      const prods=o.products?o.products.map(p=>`${p.name}${p.variant?' ('+p.variant+')':''} x${p.qty} ${p.unit} @ GH\u20B5${p.unitPrice}`).join(' | '):'';
      const inv=totalOwed(o),paid=totalPaid(o),bal=balanceAmt(o);
      rInv+=inv;rPaid+=paid;
      rows.push([i+1,o.orderNum,o.date,sh?sh.name:'-',sh?sh.location||'-':'-',prods,(o.paymentType||'').toUpperCase(),inv,paid,bal,o.creditDue||'']);
    });
    rows.push(['','','','','','','TOTALS',rInv,rPaid,rInv-rPaid,'']);
    rows.push([]);
    var collRate=repOrders.length>0?((rPaid/rInv)*100).toFixed(1)+'%':'N/A';rows.push(['','','','','','','Collection Rate',collRate,'','','']);
    const wsRep=XLSX.utils.aoa_to_sheet(rows);
    wsRep['!cols']=[{wch:4},{wch:12},{wch:12},{wch:20},{wch:16},{wch:45},{wch:14},{wch:16},{wch:16},{wch:16},{wch:14}];
    const safeRepName=rep.name.replace(/[^a-zA-Z0-9 ]/g,'').slice(0,28);
    XLSX.utils.book_append_sheet(wb,wsRep,safeRepName||'Rep');
  });

  // -- STORE BREAKDOWN SHEET --
  const storeRows=[];
  storeRows.push(['STORE / SHOP BREAKDOWN','','','','','','','']);
  storeRows.push([`Generated: ${today}`,'','','','','','','']);
  storeRows.push([]);
  storeRows.push(['#','Store Name','Owner','Location','TIN / GRA No.','Assigned Rep','Total Orders','Total Invoiced (GH\u20B5)','Total Paid (GH\u20B5)','Outstanding (GH\u20B5)','Route Days']);
  let sInv=0,sPaid=0;
  const visibleShops=d.shops.filter(s=>CU.role==='rep'?s.repId===CU.id:true);
  visibleShops.sort((a,b)=>a.name.localeCompare(b.name)).forEach((s,i)=>{
    const shopOrds=d.orders.filter(o=>o.shopId===s.id);
    const inv=shopOrds.reduce((a,o)=>a+totalOwed(o),0);
    const paid=shopOrds.reduce((a,o)=>a+totalPaid(o),0);
    sInv+=inv;sPaid+=paid;
    storeRows.push([i+1,s.name,s.owner||'-',s.location||'-',s.tin||'-',repMap[s.repId]||'-',shopOrds.length,inv,paid,inv-paid,(s.routeDays||[]).join(', ')||'-']);
  });
  storeRows.push(['','','','','','TOTALS',visibleShops.length,sInv,sPaid,sInv-sPaid,'']);
  const wsStores=XLSX.utils.aoa_to_sheet(storeRows);
  wsStores['!cols']=[{wch:4},{wch:22},{wch:18},{wch:18},{wch:16},{wch:18},{wch:10},{wch:18},{wch:18},{wch:18},{wch:28}];
  XLSX.utils.book_append_sheet(wb,wsStores,'Store Breakdown');

  // -- PAYMENT HISTORY SHEET --
  const payRows=[];
  payRows.push(['PAYMENT HISTORY','','','','','','']);
  payRows.push([`Generated: ${today}`,'','','','','','']);
  payRows.push([]);
  payRows.push(['Date','Rep','Shop','Order No.','Payment Method','Amount Paid (GH\u20B5)','Note']);
  allOrders.forEach(o=>{
    const sh=shopMap[o.shopId];
    (o.payments||[]).forEach(p=>{
      payRows.push([p.date,repMap[o.repId]||'-',sh?sh.name:'-',o.orderNum,(o.paymentType||'').toUpperCase(),Number(p.amount),p.note||'']);
    });
  });
  const wsPay=XLSX.utils.aoa_to_sheet(payRows);
  wsPay['!cols']=[{wch:14},{wch:18},{wch:22},{wch:14},{wch:14},{wch:18},{wch:30}];
  XLSX.utils.book_append_sheet(wb,wsPay,'Payment History');

  // -- DOWNLOAD --
  const fname=`SalesReport_${todayISO}.xlsx`;
  XLSX.writeFile(wb,fname);
}



// ── OFFLINE & SYNC SYSTEM ──
let isOnline = navigator.onLine;
let pendingQueue = JSON.parse(localStorage.getItem('mkt5_queue') || '[]');
let syncInProgress = false;
let eodShown = false;

// Monitor network status
window.addEventListener('online', () => {
  isOnline = true;
  document.getElementById('offlineBanner').classList.remove('show');
  updateSyncBtn();
  // Auto sync when back online
  if(pendingQueue.length > 0 && CU) {
    setTimeout(autoSync, 2000);
  }
});

window.addEventListener('offline', () => {
  isOnline = false;
  document.getElementById('offlineBanner').classList.add('show');
  updateSyncBtn();
});

function saveQueue(){
  localStorage.setItem('mkt5_queue', JSON.stringify(pendingQueue));
}

function addToQueue(action){
  action.id = Date.now().toString() + Math.random().toString(36).slice(2);
  action.timestamp = new Date().toISOString();
  pendingQueue.push(action);
  saveQueue();
  updateSyncBtn();
}

function updateSyncBtn(){
  const btn = document.getElementById('syncBtn');
  const badge = document.getElementById('syncBadge');
  const icon = document.getElementById('syncIcon');
  const label = document.getElementById('syncLabel');
  if(!btn) return;
  const count = pendingQueue.length;
  if(syncInProgress){
    btn.className = 'sync-btn syncing';
    icon.innerHTML = '<span class="spinning">&#x21BB;</span>';
    label.textContent = 'Syncing...';
    badge.style.display = 'none';
  } else if(count > 0){
    btn.className = 'sync-btn has-pending';
    icon.innerHTML = '&#x21BB;';
    label.textContent = 'Sync';
    badge.textContent = count;
    badge.style.display = 'block';
  } else {
    btn.className = 'sync-btn synced';
    icon.innerHTML = '&#x2713;';
    label.textContent = 'Synced';
    badge.style.display = 'none';
    // Reset to normal after 3 seconds
    setTimeout(()=>{
      if(pendingQueue.length===0){
        btn.className='sync-btn';
        icon.innerHTML='&#x21BB;';
        label.textContent='Sync';
      }
    }, 3000);
  }
}

async function processQueue(){
  if(!isOnline || !authToken || pendingQueue.length === 0) return;
  syncInProgress = true;
  updateSyncBtn();
  const failed = [];
  for(const action of pendingQueue){
    try {
      if(action.type === 'CREATE_ORDER'){
        const order = await api('/api/orders','POST', action.data);
        // Update local cache with server ID
        const d = ld();
        const idx = d.orders.findIndex(o => o._localId === action.localId);
        if(idx > -1){ d.orders[idx] = order; sd(d); }
      } else if(action.type === 'UPDATE_ORDER'){
        await api('/api/orders/'+action.id,'PUT', action.data);
      } else if(action.type === 'ADD_PAYMENT'){
        const updated = await api('/api/orders/'+action.id+'/payments','POST', action.data);
        const d = ld();
        const idx = d.orders.findIndex(o => (o._id||o.id) === action.id);
        if(idx > -1){ d.orders[idx] = updated; sd(d); }
      } else if(action.type === 'MARK_DELIVERED'){
        await api('/api/orders/'+action.id,'PUT',{deliveryStatus:'delivered',deliveredAt:action.deliveredAt});
      } else if(action.type === 'CREATE_SHOP'){
        const shop = await api('/api/shops','POST', action.data);
        const d = ld();
        const idx = d.shops.findIndex(s => s._localId === action.localId);
        if(idx > -1){ d.shops[idx] = shop; sd(d); }
      } else if(action.type === 'MARK_VISIT'){
        await api('/api/visits','POST', action.data);
      }
    } catch(e){
      console.warn('Queue item failed:', action.type, e.message);
      failed.push(action);
    }
  }
  pendingQueue = failed;
  saveQueue();
  syncInProgress = false;
  updateSyncBtn();
  if(failed.length === 0 && CU){
    // Reload fresh data from server
    await loadFromAPI();
    renderPage();
  }
}

async function manualSync(){
  if(!CU) return;
  if(!isOnline){
    alert('No network connection. Please check your internet and try again.');
    return;
  }
  if(syncInProgress) return;
  try {
    syncInProgress = true;
    updateSyncBtn();
    await processQueue();
    await loadFromAPI();
    renderPage();
  } catch(e){
    console.warn('Sync error:', e);
  } finally {
    syncInProgress = false;
    updateSyncBtn();
  }
}

async function autoSync(){
  if(!isOnline || !authToken || syncInProgress) return;
  await processQueue();
}

// End of day reminder - check at 5PM and 7PM
function checkEODReminder(){
  if(!CU || eodShown) return;
  const h = new Date().getHours();
  if((h >= 17) && pendingQueue.length > 0){
    document.getElementById('eodBanner').classList.add('show');
    eodShown = true;
  }
}
function dismissEOD(){
  document.getElementById('eodBanner').classList.remove('show');
}

// Auto sync every 5 minutes when online
setInterval(()=>{ if(isOnline && CU && pendingQueue.length > 0) autoSync(); }, 5 * 60 * 1000);
// Check EOD reminder every 30 minutes
setInterval(checkEODReminder, 30 * 60 * 1000);

// ── OFFLINE-FIRST API WRAPPER ──
// Override api() for critical write operations to queue when offline
async function apiWithQueue(path, method, body, queueAction){
  if(isOnline && authToken){
    try {
      return await api(path, method, body);
    } catch(e){
      // If it fails, queue it
      if(queueAction){ addToQueue(queueAction); }
      throw e;
    }
  } else {
    // Offline - save locally and queue
    if(queueAction){ addToQueue(queueAction); }
    return null; // caller handles null = offline save
  }
}

// ── MARK AS DELIVERED ──
async function markDelivered(orderId){
  const deliveredAt = new Date().toISOString().slice(0,10);
  const d = ld();
  const order = d.orders.find(o => (o._id||o.id) === orderId);
  if(!order) return;
  order.deliveryStatus = 'delivered';
  order.deliveredAt = deliveredAt;
  sd(d);

  if(isOnline && authToken){
    try {
      await api('/api/orders/'+orderId,'PUT',{deliveryStatus:'delivered',deliveredAt});
    } catch(e){
      addToQueue({type:'MARK_DELIVERED',id:orderId,deliveredAt});
    }
  } else {
    addToQueue({type:'MARK_DELIVERED',id:orderId,deliveredAt});
  }
  renderPage();
}


// -- PRINT --
function doPrint(){
  const d=ld();
  const repMap={};d.users.forEach(u=>repMap[u.id]=u.name);
  const shopMap={};d.shops.forEach(s=>shopMap[s.id]=s);
  let orders=d.orders.filter(o=>CU.role==='rep'?o.repId===CU.id:(!VR||o.repId===VR)).filter(orderInRange);
  const now=new Date();
  const dateStr=now.toLocaleDateString('en-GH',{year:'numeric',month:'short',day:'numeric'});
  const timeStr=now.toLocaleTimeString('en-GH',{hour:'2-digit',minute:'2-digit'});
  const tOwed=orders.reduce((a,o)=>a+orderTotal(o),0);
  const tPaid=orders.reduce((a,o)=>a+paidInRange(o),0);
  const tBal=orders.reduce((a,o)=>a+balanceAmt(o),0);
  const tCredit=orders.reduce((a,o)=>a+creditAmt(o),0);
  let html=`<div class="p-company">INVOICE</div>
    <div class="p-sub">Sales & Payment Record</div>
    <div class="p-sub">${dateStr} ${timeStr}</div>
    <div class="p-sub">Prepared by: ${CU.name}</div>
    <hr class="p-div">
    <div class="p-sec">Summary</div>
    <div class="p-row"><span class="l">Total Orders</span><span class="v">${orders.length}</span></div>
    <div class="p-row"><span class="l">Total Invoiced</span><span class="v">${fmt(tOwed)}</span></div>
    <div class="p-row"><span class="l">Total Collected</span><span class="v">${fmt(tPaid)}</span></div>
    <div class="p-row"><span class="l">Outstanding</span><span class="v">${fmt(tBal)}</span></div>
    <div class="p-row"><span class="l">Credit Held</span><span class="v">${fmt(tCredit)}</span></div>
    <hr class="p-div">
    <div class="p-sec">Order Details</div><hr class="p-div">`;
  orders.forEach(o=>{
    const sh=shopMap[o.shopId];const s=getStatus(o);
    const owed=orderTotal(o),paid=totalPaid(o),bal=balanceAmt(o),credit=creditAmt(o);
    const statusLabel=s==='paid'?'FULLY PAID':s==='credit'?'CREDIT BALANCE':s==='partial'?'PART PAID':isOverdue(o)?'OVERDUE':'OWING';
    let prodsHTML='';
    if(o.products&&o.products.length){
      prodsHTML=`<div class="p-sec">Products</div>`;
      o.products.forEach(p=>{prodsHTML+=`<div class="p-prod"><div class="p-prod-name">${p.name}${p.variant?' ('+p.variant+')':''}</div><div class="p-prod-detail"><span>${p.qty} ${p.unit} @ ${fmt(p.unitPrice)}</span><span>${fmt(p.qty*p.unitPrice)}</span></div></div>`;});
      prodsHTML+=`<div class="p-total"><span>INVOICE TOTAL</span><span>${fmt(owed)}</span></div>`;
    }
    let paysHTML='';
    const pays=paysInRange(o);
    if(pays.length){paysHTML=`<div class="p-sec">Payments</div>`;pays.forEach(p=>{paysHTML+=`<div class="p-pay-row"><span>${p.date}${p.note?' \u00B7 '+p.note:''}</span><span>${fmt(p.amount)}</span></div>`;});}
    html+=`<div class="p-block">
      <div class="p-row"><span class="l" style="font-weight:bold;font-size:13px">${o.orderNum}</span><span class="v">${o.date}</span></div>
      <div class="p-row"><span class="l">Shop</span><span class="v">${sh?sh.name:'-'}</span></div>
      ${sh&&sh.location?`<div class="p-row"><span class="l">Location</span><span class="v">${sh.location}</span></div>`:''}
      ${sh&&sh.contact?`<div class="p-row"><span class="l">Contact</span><span class="v">${sh.contact}</span></div>`:''}
      ${sh&&sh.tin?`<div class="p-row"><span class="l">TIN</span><span class="v">${sh.tin}</span></div>`:''}
      ${CU.role==='manager'?`<div class="p-row"><span class="l">Rep</span><span class="v">${repMap[o.repId]||'-'}</span></div>`:''}
      <div class="p-row"><span class="l">Payment Type</span><span class="v">${(o.paymentType||'').toUpperCase()}</span></div>
      ${o.creditDue?`<div class="p-row"><span class="l">Credit Due</span><span class="v">${o.creditDue}</span></div>`:''}
      ${prodsHTML}
      <hr class="p-div">
      <div class="p-row"><span class="l">Invoiced</span><span class="v">${fmt(owed)}</span></div>
      <div class="p-row"><span class="l">Paid</span><span class="v">${fmt(paid)}</span></div>
      <div class="p-row"><span class="l">Balance</span><span class="v">${fmt(bal)}</span></div>
      ${credit>0?`<div class="p-row"><span class="l">Credit</span><span class="v">${fmt(credit)}</span></div>`:''}
      ${paysHTML}
      <div class="p-status">${statusLabel}</div>
      ${o.notes?`<div class="p-sub" style="text-align:left;font-style:italic">Note: ${o.notes}</div>`:''}
      <div class="p-gra">VAT/GRA: Tax absorbed by distributor.<br>This invoice is for delivery & payment records only.</div>
    </div>`;
  });
  html+=`<div class="p-footer">--- End of Invoice ---<br>Printed ${dateStr} ${timeStr}</div>`;
  document.getElementById('printDoc').innerHTML=html;
  setTimeout(()=>window.print(),150);
}
